<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Rus tili ustozining shaxsiy kabineti.">
    <title>Kirish | Rus Tili Ustozi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="admin-page">
    <main>
      <section class="login-screen" id="loginScreen" aria-labelledby="login-title">
        <form class="login-card" id="loginForm">
          <a class="brand" href="/" aria-label="Portfolio sahifasiga qaytish">
            <span class="brand-mark">R</span>
            <span>
              <strong>Rus Tili Ustozi</strong>
              <small>Shaxsiy kabinet</small>
            </span>
          </a>
          <div>
            <p class="section-kicker">Kirish</p>
            <h1 id="login-title">Ustoz kabinetiga kiring</h1>
            <p>Login va parolni kiriting. Kabinetda o'quvchilar, darslar va so'rovlar saqlanadi.</p>
          </div>
          <label>
            Login
            <input type="text" name="username" autocomplete="username" placeholder="Login" required>
          </label>
          <label>
            Parol
            <input type="password" name="password" autocomplete="current-password" placeholder="Parol" required>
          </label>
          <button class="button primary" type="submit">Kirish <span aria-hidden="true">-></span></button>
          <p class="form-status" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="admin-shell hidden" id="adminShell" aria-label="Ustoz kabineti">
        <aside class="admin-sidebar">
          <a class="brand" href="/">
            <span class="brand-mark">R</span>
            <span>
              <strong>Rus Tili Ustozi</strong>
              <small>Shaxsiy kabinet</small>
            </span>
          </a>

          <nav class="admin-nav" aria-label="Kabinet bo'limlari">
            <button class="admin-nav-item active" type="button" data-tab="dashboard">Bosh sahifa</button>
            <button class="admin-nav-item" type="button" data-tab="students">O'quvchilar</button>
            <button class="admin-nav-item" type="button" data-tab="lessons">Darslar</button>
            <button class="admin-nav-item" type="button" data-tab="payments">To'lovlar</button>
            <button class="admin-nav-item" type="button" data-tab="leads">So'rovlar</button>
          </nav>

          <div class="sidebar-actions">
            <a class="button secondary" href="/">Portfolio</a>
            <button class="button danger ghost" type="button" id="logoutButton">Chiqish</button>
          </div>
        </aside>

        <div class="admin-main">
          <header class="admin-topbar">
            <div>
              <p class="section-kicker" id="tabKicker">Bosh sahifa</p>
              <h1 id="tabTitle">Bugungi holat</h1>
            </div>
          </header>

          <section class="admin-panel active" id="dashboardPanel" data-panel="dashboard"></section>
          <section class="admin-panel" id="studentsPanel" data-panel="students"></section>
          <section class="admin-panel" id="lessonsPanel" data-panel="lessons"></section>
          <section class="admin-panel" id="paymentsPanel" data-panel="payments"></section>
          <section class="admin-panel" id="leadsPanel" data-panel="leads"></section>
        </div>
      </section>
    </main>

    <template id="emptyStateTemplate">
      <div class="empty-state">
        <strong>Hozircha ma'lumot yo'q</strong>
        <span>Yangi yozuv qo'shilganda shu yerda ko'rinadi.</span>
      </div>
    </template>

    <script src="/admin.js"></script>
  </body>
</html>
